[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ish-site-editor"
version = "0.1.0"
description = "Local content editor for the International Society for Hantaviruses website"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.120.0",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.10.3",
  "python-multipart==0.0.26",
  "Pillow==12.0.0",
  "keyring==25.6.0",
]

[project.scripts]
ish-editor = "editor.launcher:main"

[tool.setuptools.packages.find]
include = ["editor*", "scripts*"]
